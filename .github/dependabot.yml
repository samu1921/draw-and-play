version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Patch and minor updates come as one pull request; major updates one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Node types follow the Node version in the Dockerfile and CI, which is upgraded on purpose.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # vue-tsc builds on the JS API of the compiler, which the native TypeScript 7 no longer ships;
      # a new major waits until the Vue tooling supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    ignore:
      # A new Node major goes together with CI, engines and @types/node, so it is upgraded on purpose.
      - dependency-name: node
        update-types: [version-update:semver-major]
