name: Release

# `npm run release:publish` pushes a tag such as v0.2.0 (see README, "Releases"). That runs the full CI,
# publishes the Docker image to the GitHub Container Registry and creates a GitHub release with notes
# from the commits.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (prepare releases with npm run release)"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  image:
    name: Docker image
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3, 1.2 and latest; pre-releases (v1.2.3-rc.1) only get their own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Draw & Play
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      # Both platforms build natively without emulation, see the Dockerfile.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Add the Docker image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          fence='```'
          printf '\n### Docker image\n\n%s\n%s\n%s\n\nSee docs/deploy.md for installing and updating.\n' "$fence" "$image" "$fence" >> RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
