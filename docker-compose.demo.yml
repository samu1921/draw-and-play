# Demo stack: its own project (containers and data volumes), seeded with the demo club championship.
# Runs next to the normal stack on http://localhost:8090.
#   npm run demo         start (creates the demo data on first start)
#   npm run demo:reset   throw all demo data away and start fresh
#   npm run demo:down    stop
# Credentials live in docker/demo.env and are for local demos only.

services:
  db:
    # No host port: the demo database is only reachable by the demo app.
    ports: !reset []

  app:
    environment:
      DEMO_SEED: "true"

  # Demo data can be recreated at any time, so the demo stack takes no backups.
  backup:
    profiles: ["never"]

  proxy:
    ports: !override
      - "${DEMO_HTTP_PORT:-8090}:80"
